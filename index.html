<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 萬聖節料理挑戰賽</title>
<style>
:root{--bg:#0d0814;--card:#1a1226;--line:#32204a;--tx:#f3eafc;--mu:#a999c0;--or:#ff7a1a;--pu:#9b5cff;--rd:#e5304a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2b1245,#0d0814 60%);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));line-height:1.6}
header{text-align:center;padding:22px 16px 8px}
h1{margin:0;font-size:24px;color:var(--or);text-shadow:0 0 18px #ff7a1a88}
.sub{color:var(--mu);font-size:13px}
main{padding:8px 14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;margin-right:6px;background:var(--pu);color:#fff}
.tag.b{background:var(--or);color:#1a0b00}
.ph{position:relative;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.ph img{width:100%;display:block;max-height:340px;object-fit:cover}
.up{position:absolute;right:8px;bottom:8px;background:#000b;border:1px solid var(--line);color:var(--tx);font-size:12px;padding:4px 10px;border-radius:99px}
.up input{display:none}
p{margin:6px 0;font-size:14px;color:#d8c9ee}
ul{padding-left:20px;font-size:14px;color:#d8c9ee;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#120a1dee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font-size:12px}
nav button b{display:block;font-size:20px}
nav button.on{color:var(--or)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{flex:1;min-width:52px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--pu);border-color:var(--pu)}
.chip.ok::after{content:" ✓";color:#7dff9b}
.stars{display:flex;gap:6px}
.stars button{flex:1;font-size:22px;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:#120a1d;color:var(--mu)}
.stars button.on{background:var(--or);color:#1a0b00;border-color:var(--or)}
.row{margin:10px 0 2px;font-size:14px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--or)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:700;background:linear-gradient(90deg,var(--or),var(--rd));color:#fff;margin:8px 0}
.btn.g{background:#2a1c3d;font-size:14px;font-weight:400}
.warn{color:#ffcf7a;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;padding:10px 4px;border:0;background:var(--card);color:var(--mu);font-size:13px}
.seg button.on{background:var(--pu);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
td:first-child,th:first-child{text-align:left}
.award{border:1px solid var(--or);box-shadow:0 0 18px #ff7a1a44}
.award .t{font-size:13px;color:var(--or)}.award .w{font-size:19px;font-weight:700}
.big{font-size:34px;font-weight:800;color:var(--or)}
.bar{height:10px;border-radius:9px;background:#120a1d;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--or))}
</style></head><body>

const D=[
{g:'A',t:'湯品',n:'女巫的墨黑魔咒：松露芋香深淵濃湯',d:'悄悄靠近女巫的沸騰大鍋，裡頭正咕嘟咕嘟翻滾著神秘的漆黑液體……！這道萬聖特調以竹炭粉調和濃郁香醇的奶油濃湯，營造出極具震撼力的深淵視覺效果。舀起一勺，裡面藏著香氣逼人的松露餛飩與Q彈綿密的芋頭湯圓，松露的奢華蕈香與芋頭的甜潤在口中交織，每一口都是驚喜的美味魔咒！'},
{g:'A',t:'主餐',n:'血染魔掌牛排佐酥脆斷指卷',d:'萬聖夜限定！以德國吐司卷巧思打造的魔鬼手指，包覆著香煎厚切牛排，淋上滿滿血色醬汁，兼具驚悚視覺與頂級美味的萬聖節饗宴！'},
{g:'B',t:'甜點',n:'頭殼壞掉',d:'這絕對不是從某個用腦過度的倒楣鬼頭上拿下來的。外層是用翻糖捏的腦迴，切開有東西流出來也是正常的，這可是流心布朗尼，上面那是蔓越莓果醬，旁邊那片...就不解釋了，快趁新鮮吃！'},
{g:'B',t:'副餐',n:'怪寶寶卡布里',d:'新鮮番茄、翠綠羅勒葉，還有笑得你心裡發寒的...咦？上面那肯定只是莓果紅酒醋吧？酸甜清爽、滋味迷人，今晚最無害的義式小點。手機先吃，記得say cheese~'}];
const TC=[['味道與調味',10],['口感與熟度',5],['食材搭配與協調性',5],['整體完成度',5]];
let S={ap:{},tt:{},rev:false},tab=0,judge=1,tg='A';
try{const x=localStorage.getItem('hw26');if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem('hw26',JSON.stringify(S))}catch(e){}};
const $=s=>document.getElementById(s);
const TABS=[['📜','賽制'],['🍽️','料理'],['👁️','外觀'],['👅','美味'],['🏆','結果']];
// scores
const apOf=d=>{let s=0,c=0;for(let j=1;j<=5;j++){const v=S.ap[j+'-'+d];if(v){s+=v;c++}}return{s,c}};
const ttOf=d=>{let s=0,c=0;TC.forEach((_,k)=>{const v=S.tt[d+'-'+k];if(v!==undefined){s+=v;c++}});return{s,c}};
const judgeDone=j=>D.every((_,d)=>S.ap[j+'-'+d]);
function img(d,up){return `<div class="ph"><img src="${IMG[d]}" alt="料理照片"><label class="up">📷 上傳照片<input type="file" accept="image/*" onchange="upl(${d},this)"></label></div>`}
function upl(d,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{IMG[d]=r.result;render()};r.readAsDataURL(f)}
function render(){
$('nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};render();scrollTo(0,0)"><b>${t[0]}</b>${t[1]}</button>`).join('');
$('app').innerHTML=[rules,dishes,appear,taste,result][tab]();save()}
function rules(){return `
<div class="card"><h3>🎲 分組方式</h3><p>雙方抽籤決定：<br><span class="tag">A 組</span>主餐＋湯品<br><span class="tag b">B 組</span>副餐＋甜點</p><p>所有料理皆須製作 2 人份，共 4 道料理。</p></div>
<div class="card"><h3>👁️ 一、擺盤外觀評分（50 分）</h3><ul><li>評審：5 位朋友</li><li>每位朋友須針對 4 道料理分別評 1～5 分，必須完成 4 道菜評分</li><li>保密機制：只看成品照片，不公開料理者姓名及組別</li><li>每道料理最高 25 分（5 人×5 分），外觀總分最高 50 分</li></ul></div>
<div class="card"><h3>👅 二、美味程度評分（50 分）</h3><ul><li>雙方互相試吃，由對方評分（不可評自己的料理，須實際試吃）</li><li>每道料理最高 25 分：味道與調味 10、口感與熟度 5、食材搭配與協調性 5、整體完成度 5</li><li>兩道料理合計最高 50 分</li><li>雙方先獨立評分，再按「一鍵公布結果」</li></ul></div>
<div class="card"><h3>🧮 三、總分與獎項</h3><p>外觀總分（50）＋ 美味總分（50）＝ 最終總分（100）</p><ul><li>🏆 萬聖節料理挑戰賽總冠軍：最終總分最高者</li><li>👻 這什麼鬼東西獎：外觀總分最高的單道料理</li><li>😋 好吃死了獎：美味程度得分最高的單道料理</li></ul></div>`}
function dishes(){return D.map((x,i)=>`<div class="card">${img(i)}<span class="tag ${x.g=='B'?'b':''}">${x.g} 組</span><span class="tag" style="background:#3b2a55">${x.t}</span><h3 style="margin-top:8px">${x.n}</h3><p>${x.d}</p></div>`).join('')}
function appear(){
const ch=[1,2,3,4,5].map(j=>`<button class="chip ${j==judge?'on':''} ${judgeDone(j)?'ok':''}" onclick="judge=${j};render()">評審${j}</button>`).join('');
const done=D.filter((_,d)=>S.ap[judge+'-'+d]).length;
return `<div class="card"><h3>👁️ 擺盤外觀評分</h3><p class="sub">只看照片、不公開料理者與組別。每道 1～5 分。</p><div class="chips">${ch}</div><p class="warn">評審${judge}：已完成 ${done}/4 道${done==4?' ✅':'（須全部完成）'}</p></div>`+
D.map((x,d)=>{const v=S.ap[judge+'-'+d]||0;return `<div class="card">${IMG[d]?`<div class="ph"><img src="${IMG[d]}" alt=""></div>`:''}<div class="row"><b>匿名料理 ${'①②③④'[d]}</b><span>${v?v+' 分':'未評'}</span></div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${v>=n?'on':''}" onclick="S.ap['${judge}-${d}']=${n};render()">★</button>`).join('')}</div></div>`}).join('')}
function taste(){
const ds=D.map((x,i)=>i).filter(i=>D[i].g==tg);
return `<div class="card"><h3>👅 美味程度評分</h3><p class="sub">由對方評分，不可評自己的料理；須實際試吃。</p><div class="seg"><button class="${tg=='A'?'on':''}" onclick="tg='A';render()">B 組評 A 組料理</button><button class="${tg=='B'?'on':''}" onclick="tg='B';render()">A 組評 B 組料理</button></div></div>`+
ds.map(d=>{const t=ttOf(d);return `<div class="card"><h3>${D[d].t}｜${D[d].n}</h3><div class="row"><span class="sub">此道得分</span><b style="color:var(--or)">${t.s} / 25</b></div>`+
TC.map((c,k)=>{const v=S.tt[d+'-'+k];return `<div class="row"><span>${c[0]}</span><span>${v===undefined?'未評':v+' / '+c[1]}</span></div><input type="range" min="0" max="${c[1]}" step="1" value="${v||0}" oninput="S.tt['${d}-${k}']=+this.value;this.previousElementSibling.lastChild.textContent=this.value+' / ${c[1]}';upd()">`}).join('')+`</div>`}).join('')}
function upd(){save()}
function calc(){
return D.map((x,d)=>({d,ap:apOf(d).s,tt:ttOf(d).s}))}
function missing(){let m=[];for(let j=1;j<=5;j++)if(!judgeDone(j))m.push('評審'+j+'外觀');D.forEach((_,d)=>{if(ttOf(d).c<4)m.push(D[d].t+'美味')});return m}
function result(){
if(!S.rev){const m=missing();return `<div class="card" style="text-align:center"><div class="big">🔮</div><h3>結果尚未公布</h3><p>雙方先獨立評分完畢後，再一起揭曉！</p>${m.length?`<p class="warn">尚未完成：${m.join('、')}</p>`:'<p style="color:#7dff9b">✅ 所有評分已完成</p>'}<button class="btn" onclick="reveal()">🎃 一鍵公布結果</button></div>`+live()}
const R=calc(),team=g=>{const a=R.filter(r=>D[r.d].g==g);return{ap:a.reduce((s,r)=>s+r.ap,0),tt:a.reduce((s,r)=>s+r.tt,0)}};
const A=team('A'),B=team('B'),ta=A.ap+A.tt,tb=B.ap+B.tt;
const champ=ta==tb?'平手！':ta>tb?'A 組（主餐＋湯品）':'B 組（副餐＋甜點）';
const top=k=>{const mx=Math.max(...R.map(r=>r[k]));return R.filter(r=>r[k]==mx).map(r=>`${D[r.d].t}《${D[r.d].n}》`).join('、')+`（${mx} 分）`};
const bar=(n,m)=>`<div class="bar"><i style="width:${n/m*100}%"></i></div>`;
return `<div class="card award" style="text-align:center"><div class="big">🏆</div><div class="t">萬聖節料理挑戰賽 總冠軍</div><div class="w">${champ}</div><p>A 組 ${ta} 分 vs B 組 ${tb} 分（滿分 100）</p></div>
<div class="card award"><div class="t">👻 這什麼鬼東西獎（外觀最高單道）</div><div class="w" style="font-size:16px">${top('ap')}</div></div>
<div class="card award"><div class="t">😋 好吃死了獎（美味最高單道）</div><div class="w" style="font-size:16px">${top('tt')}</div></div>
<div class="card"><h3>📊 組別總分</h3>${[['A',A],['B',B]].map(([g,t])=>`<div class="row"><b>${g} 組</b><span>外觀 ${t.ap}/50 ＋ 美味 ${t.tt}/50 ＝ <b style="color:var(--or)">${t.ap+t.tt}</b></span></div>${bar(t.ap+t.tt,100)}`).join('')}</div>
<div class="card"><h3>🍽️ 各道料理明細</h3><table><tr><th>料理</th><th>外觀/25</th><th>美味/25</th><th>合計</th></tr>${R.map(r=>`<tr><td>${D[r.d].g}｜${D[r.d].t}</td><td>${r.ap}</td><td>${r.tt}</td><td><b>${r.ap+r.tt}</b></td></tr>`).join('')}</table></div>
<button class="btn g" onclick="S.rev=false;render()">🔒 隱藏結果</button><button class="btn g" onclick="if(confirm('確定清除所有評分？')){S={ap:{},tt:{},rev:false};render()}">🗑️ 重設全部評分</button>`}
function live(){const g=x=>`${x}`;return `<div class="card"><h3>📝 評分進度</h3><p class="sub">結果公布前不顯示分數。</p><table><tr><th>項目</th><th>進度</th></tr>${[1,2,3,4,5].map(j=>`<tr><td>評審${j} 外觀</td><td>${D.filter((_,d)=>S.ap[j+'-'+d]).length}/4</td></tr>`).join('')}${D.map((x,d)=>`<tr><td>${x.t} 美味</td><td>${ttOf(d).c}/4 項</td></tr>`).join('')}</table></div>`}
function reveal(){const m=missing();if(m.length&&!confirm('尚有未完成評分：'+m.join('、')+'\n仍要公布結果嗎？'))return;S.rev=true;render();scrollTo(0,0)}
render();
</script></body></html>
